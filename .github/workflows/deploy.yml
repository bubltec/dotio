name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdc'
      - 'docs/**'
      - '.cursor/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # No `environment:` so the diff is visible before anyone approves production.
  diff:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: cdk diff
        working-directory: infra/cdk
        run: |
          {
            echo '## DotioWaf + DotioSite + DotioCi diff'; echo '```'
            npx cdk diff DotioWaf DotioSite DotioCi 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: diff
    runs-on: ubuntu-latest
    # The real gate: required reviewers on the `production` GitHub Environment.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: cdk deploy
        working-directory: infra/cdk
        run: npx cdk deploy DotioCi DotioWaf DotioSite --require-approval never
